name: "CWV: New client onboarding"
description: "Run the Phase 1 onboarding checklist for a new client site."
title: "CWV Onboarding: <client> — <domain>"
labels: ["cwv", "onboarding"]
body:
  - type: input
    id: client
    attributes:
      label: Client name
      placeholder: "Acme Agency Client"
    validations:
      required: true

  - type: input
    id: domain
    attributes:
      label: Domain
      placeholder: "https://example.com"
    validations:
      required: true

  - type: textarea
    id: pages
    attributes:
      label: Key pages to baseline (homepage, top landing pages, high-conversion pages)
      description: "List URLs you’ll run PSI (mobile + desktop) on."
      placeholder: |
        - https://example.com/
        - https://example.com/pricing
        - https://example.com/contact
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Phase 1 — Client Onboarding checklist
      options:
        - label: "Baseline all key pages — Run PageSpeed Insights (mobile + desktop) on the homepage, top 5 landing pages, and any high-conversion pages (pricing, contact, checkout)"
        - label: "Record baseline scores — Document current LCP, INP, CLS, FCP, TBT, and overall Performance Score for each page"
        - label: "Check field data availability — Verify whether the site has enough traffic for Chrome User Experience Report (CrUX) field data. If not, lab data will be your primary source"
        - label: "Identify the LCP element on each key page — Is it an image? A text block? A video? Knowing this tells you where to focus optimization"
        - label: "Audit third-party scripts — List all third-party scripts (analytics, chat widgets, ads, tracking pixels). Note which ones are render-blocking"
        - label: "Check image optimization — Are images served in modern formats (WebP/AVIF)? Are dimensions set? Are they responsive?"
        - label: "Test on real devices — Lab tests on a fast laptop don't reflect mobile experience. Test on a mid-range Android device or use throttled DevTools"
        - label: "Set performance budgets — Based on baselines and 'Good' thresholds, define target values for each metric (LCP/INP/CLS/Score)"
        - label: "Set up automated monitoring — Configure daily automated tests for all key pages (both mobile and desktop strategies). If the client has no sitemap: add key URLs manually; many tools support sitemap + manual URL entry."
        - label: "Configure alerts — Set threshold-based alerts so you're notified when any metric crosses its budget"
        - label: "Document the monitoring setup — Record which pages are monitored, which budgets are set, and who receives alerts"

  - type: textarea
    id: budgets
    attributes:
      label: Budgets (targets)
      description: "Suggested baseline: LCP ≤ 2.5s (stretch ≤ 1.8s), INP ≤ 200ms (stretch ≤ 100ms), CLS ≤ 0.1 (stretch ≤ 0.05), Score ≥ 90."
      placeholder: |
        LCP: <= 2.5s (mobile) / <= 2.5s (desktop)
        INP: <= 200ms (mobile) / <= 200ms (desktop)
        CLS: <= 0.1 (mobile) / <= 0.1 (desktop)
        Score: >= 90 (mobile) / >= 90 (desktop)
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: Notes / findings
      placeholder: "Third-party scripts, LCP element details, device testing notes, etc."
